openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0
paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /api/v1/products:
    get:
      summary: Mengambil daftar produk
      description: Mengambil daftar produk dengan pagination, filter, dan pengurutan.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Nomor halaman yang ingin ditampilkan.
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: per_page
          in: query
          required: false
          description: Jumlah produk yang ditampilkan per halaman.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15

        - name: category_id
          in: query
          required: false
          description: Filter produk berdasarkan ID kategori.
          schema:
            type: integer

        - name: q
          in: query
          required: false
          description: Kata kunci pencarian produk.
          schema:
            type: string

        - name: sort
          in: query
          required: false
          description: Pengurutan data produk sesuai pilihan yang didukung API.
          schema:
            type: string

      responses:
        '200':
          description: Data produk berhasil ditampilkan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        price:
                          type: integer
                        category:
                          type: string
                  links:
                    type: object
                    description: Tautan navigasi pagination.
                  meta:
                    type: object
                    description: Informasi pagination.
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer

        '401':
          description: Token autentikasi tidak valid atau tidak tersedia.
          
        '422':
          description: Parameter permintaan tidak valid.
  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      qty: { type: integer }
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      total: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer